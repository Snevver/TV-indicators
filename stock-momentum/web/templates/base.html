<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Momentum{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E7490'/><path d='M6 22l6-7 5 4 9-11' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
{% block head %}{% endblock %}
</head>
<body>
{% if session.get('in') %}
<header class="top">
  <a class="brand" href="/"><span class="dotmark"></span>Momentum</a>
  <nav>
    <a href="/" class="{{ 'on' if request.path == '/' }}">Dashboard</a>
    <a href="/strategy" class="{{ 'on' if request.path == '/strategy' }}">Strategy</a>
    <a href="/settings" class="{{ 'on' if request.path == '/settings' }}">Settings</a>
  </nav>
  <form method="post" action="/logout" class="signout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="ghost">Sign out</button>
  </form>
</header>
{% endif %}
<main class="wrap">{% block body %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
